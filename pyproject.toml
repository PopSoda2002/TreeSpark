[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "treespark"
version = "0.1.0"
description = "Calibrated, load-adaptive draft trees for semi-autoregressive speculative decoding"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "torch",
    "transformers",
    "safetensors",
    "huggingface_hub",
]

[tool.setuptools]
packages = ["treespark"]
